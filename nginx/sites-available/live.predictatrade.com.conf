# ============================================================
# live.predictatrade.com — Realtime/Edge Domain
# Serves: Public live dashboard (view-only), WebSocket, HTTP API
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name live.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/live.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker embedded DNS — re-resolve upstream service names every 10s.
    # Without this, nginx caches container IPs at startup and returns 502
    # after any backend container is rebuilt/recreated with a new IP.
    # NOTE: static proxy_pass with a hostname resolves ONCE at config load —
    # the resolver above only applies to VARIABLED proxy_pass. Every dynamic
    # upstream MUST be referenced through a variable (this was the 2026-09-10
    # live.predictatrade.com 502 root cause: 4,418 502s while the engine and
    # terminal containers were recreated during deploys with fresh IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Public visitor traffic is served by the dedicated live-terminal edge
    # (static terminal + preview funnel + guarded proxy) — the trading
    # engine is never exposed to anonymous traffic.
    set $upstream_edge    "live-terminal:13090";
    set $upstream_engine  "pat-realtime:13081";

    # Serve all static assets (index.html, sw.js, echarts.min.js, manifest.json, icons)
    # from the pat-live build directory. Without this, assets fall through to the
    # nginx default root (/etc/nginx/html) and 404.
    root /var/www/pat-live;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — allow WS connections to self
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://live.predictatrade.com https://live.predictatrade.com; frame-ancestors 'self' https://predictatrade.com https://www.predictatrade.com" always;

    # Public live dashboard (view-only, no auth)
    location = / {
        try_files /terminal.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # The terminal page itself — no-cache so updates ship immediately
    location = /terminal.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Service worker must be re-fetched on update checks (but not blocked from HTTP cache entirely —
    # max-age=0 + must-revalidate is the PWA-correct policy; no-store can break iOS SW updates)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Immutable static assets (icons, echarts, logos) — hashed content, cache hard
    location ~* \.(png|svg|ico|woff2?|min\.js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback: serve existing static assets, otherwise fall back to index.html
    # for client-side routes. Specific prefixes (/api/v1/, /ws, /health) take
    # precedence over this generic rule.
    location / {
        try_files $uri $uri/ /terminal.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # WebSocket connections — browser/dashboard route
    # Goes to live-terminal:13090 (resilient relay with caching)
    # NOT directly to pat-realtime:13081 — this way the dashboard
    # never loses connection when the signal engine restarts.
    # NOTE: Cloudflare free plan cuts idle WebSockets at 100s, so the
    # nginx-side timeout MUST be < 100s or CF silently drops the socket
    # mid-frame. 90s keeps a 10s safety margin.
    location /ws {
        proxy_pass http://$upstream_edge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        limit_conn conn_per_ip 10;
    }

    # Live preview endpoints — served by live-terminal
    location /api/v1/live-preview/ {
        proxy_pass http://$upstream_edge;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://$upstream_engine;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        add_header Cache-Control "no-store" always;
    }

    # Health check (for monitoring)
    location = /health {
        proxy_pass http://$upstream_engine;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    access_log /var/log/nginx/live.predictatrade.com.access.log;
    error_log /var/log/nginx/live.predictatrade.com.error.log warn;
}
