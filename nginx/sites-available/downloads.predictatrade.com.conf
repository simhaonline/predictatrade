# ============================================================
# downloads.predictatrade.com — EA Download Server (v1.19.0 Option B)
# Serves: MQL4/MQL5 EA sources + compiled EA binaries.
# The Windows-agent download tree (agent.exe, nssm, install scripts,
# /windows-agent/ location) was REMOVED with the agent architecture.
# SSL: Let's Encrypt (auto-renewed by certbot)
# ============================================================

# HTTP — redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name downloads.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — serves EA sources (/mql/) and compiled binaries (/downloads/)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/downloads.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MQL sources — canonical repo-root mql/ folder (single source of truth).
    # Never cache (rebuilt per release).
    location /mql/ {
        alias /var/www/mql/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        location ~ \.mq[45]$ {
            default_type text/plain;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }
    }

    # Compiled EA binaries — served from nginx/downloads (repo): the release
    # script copies freshly built .ex4/.ex5 files here. Never cache.
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        location ~ \.ex[45]$ {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }
    }

    # Health check
    location = / {
        return 200 "downloads.predictatrade.com OK\n";
        add_header Content-Type text/plain;
    }
}