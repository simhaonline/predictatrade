name: Predict-A-Trade CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go Real-Time Engine
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: realtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: 'realtime/go.mod' }
      - run: go mod download
      - run: go vet ./...
      - name: Go tests (no race)
        run: go test -count=1 -timeout=300s ./...
      - name: Go tests (race detector)
        run: go test -race -count=1 -timeout=300s ./...
        continue-on-error: true
      - run: go build -o bin/realtime-engine ./cmd/realtime-engine

  nestjs:
    name: NestJS Control Plane
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: control/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    name: Python Research Plane
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: research } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short

  windows-agent:
    name: Windows Agent (cross-compile)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: windows-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go mod download
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go build -o bin/pat-agent.exe ./cmd/client
      - run: GOOS=windows GOARCH=amd64 go build -o bin/pat-master.exe ./cmd/master

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          FOUND=0
          if grep -rn "ghp_[A-Za-z0-9]\{36\}" --include="*.ts" --include="*.go" --include="*.py" --include="*.tsx" --include="*.yml" --include="*.json" . 2>/dev/null | grep -v node_modules | grep -v '.git' | grep -v package-lock; then FOUND=1; fi
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.ts" --include="*.go" --include="*.py" --include="*.tsx" --include="*.yml" --include="*.json" . 2>/dev/null | grep -v node_modules | grep -v '.git' | grep -v package-lock | grep -v 'skip-'; then FOUND=1; fi
          if grep -rn "AKIA[A-Z0-9]\{16\}" --include="*.ts" --include="*.go" --include="*.py" --include="*.tsx" --include="*.yml" --include="*.json" . 2>/dev/null | grep -v node_modules | grep -v '.git'; then FOUND=1; fi
          if grep -rn "BEGIN.*PRIVATE KEY" --include="*.ts" --include="*.go" --include="*.py" --include="*.tsx" --include="*.yml" . 2>/dev/null | grep -v node_modules | grep -v '.git'; then FOUND=1; fi
          if grep -rn "PASSWORD\s*=\s*['\"][^'\"]\{8,\}['\"]" --include="*.env" --include="*.cfg" --include="*.conf" --include="*.ini" . 2>/dev/null | grep -v node_modules | grep -v '.git'; then FOUND=1; fi
          if grep -rn "API_KEY\s*=\s*['\"][^'\"]\{20,\}['\"]" --include="*.env" --include="*.cfg" --include="*.conf" --include="*.ini" . 2>/dev/null | grep -v node_modules | grep -v '.git'; then FOUND=1; fi
          if [ "$FOUND" -eq 1 ]; then
            echo "WARNING: Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets detected"
      - name: Dependency audit
        run: |
          cd control && npm audit --audit-level=high || true
          cd ../frontend && npm audit --audit-level=high || true
