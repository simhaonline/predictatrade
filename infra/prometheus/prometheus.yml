global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'realtime-engine'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'go-realtime'

  - job_name: 'control-plane'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'nestjs-control'

  - job_name: 'windows-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9092']
        labels:
          service: 'windows-agent'
