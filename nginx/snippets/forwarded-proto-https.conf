# ============================================================
# nginx/snippets/forwarded-proto-https.conf — :8443 edge TLS truth
# ============================================================
# On the dedicated Plesk-facing :8443 listener (plain HTTP between Plesk and
# origin) $scheme is "http", but the CLIENT-facing scheme is https (CF/Plesk
# terminate TLS). Backends (NestJS secure-cookie logic, redirect builders,
# WebSocket scheme hints) must see https.
#
# Include this in every :8443 server block AFTER the proxy headers snippet —
# it overrides the X-Forwarded-Proto that proxy-common.conf derived from
# $scheme. Plesk also sends its own X-Forwarded-Proto: https; the explicit
# set below makes the origin independent of Plesk config drift.
# ============================================================

proxy_set_header X-Forwarded-Proto https;
# Plesk vhost templates (nginx/plesk/vhosts/) send X-Forwarded-Port 443;
# forward it so absolute-URL builders do not emit :8443 links.
proxy_set_header X-Forwarded-Port 443;