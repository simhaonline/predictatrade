# Managed by nginx-manager 1.0.0

server {
    listen 80;
    listen [::]:80;

    server_name ops.simhaonline.com;

    access_log /var/log/nginx/ops.simhaonline.com.access.log;
    error_log  /var/log/nginx/ops.simhaonline.com.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nginx-manager/acme;
        default_type text/plain;
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ops.simhaonline.com;

    ssl_certificate     /etc/letsencrypt/live/ops.simhaonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.simhaonline.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NGINXMANAGER_SSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/ops.simhaonline.com.ssl.access.log;
    error_log  /var/log/nginx/ops.simhaonline.com.ssl.error.log warn;

    client_max_body_size 170m;
    send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ / {
        # Development dashboard: HTTP Basic Auth is intentionally disabled.
        # Re-enable an authenticated edge before exposing this host publicly.
        auth_basic off;

        proxy_pass http://127.0.0.1:11080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preserve application credentials for API-backed development routes.
        proxy_set_header Authorization $http_authorization;

        # WebSocket / streaming support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_redirect off;
    }
}
