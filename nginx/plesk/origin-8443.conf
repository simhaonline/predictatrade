# ============================================================
# nginx/plesk/origin-8443.conf — Plesk-facing origin edge listener
# ============================================================
# Context: Plesk server (separate box) terminates public TLS for the 6
# predictatrade.com subdomains and reverse-proxies to THIS origin on a
# dedicated plain-HTTP port :8443 (pat-nginx). Cloudflare stays orange-cloud
# in front of Plesk:
#
#   CF (TLS) → Plesk nginx (TLS) → origin :8443 (HTTP) → containers
#
# Rules of the hop Plesk → :8443:
#   • Plesk must send X-Forwarded-Proto: https (vhost templates in
#     nginx/plesk/vhosts/ set it) so backends see the outer scheme.
#   • Plesk must forward CF-Connecting-IP verbatim.
#   • X-Forwarded-For: $proxy_add_x_forwarded_for on Plesk preserves the
#     CF real-IP chain; this origin restores the client IP from
#     CF-Connecting-IP (cloudflare-realip.conf) and additionally trusts the
#     Plesk edge (plesk-edge-realip.conf).
#   • :8443 serves plain HTTP only — the public TLS surface remains on Plesk
#     (and Cloudflare). Nothing on :8443 is publicly reachable: Hetzner
#     firewall must allow :8443 ONLY from the Plesk server IP.
#   • EA direct-IP failover (api-ipv4) is NOT broken by the move: the api
#     vhost keeps its direct-TLS 443 server block in
#     nginx/sites-available/api.predictatrade.com.conf so
#     PATCloudURLFallback=https://api-ipv4.predictatrade.com still works
#     even when the Plesk path is down.
# ============================================================

# ─── api.predictatrade.com — Backend API (via Plesk) ───
# Mirrors nginx/sites-available/api.predictatrade.com.conf (443 server)
# exactly, minus TLS, listening on :8443.
server {
    listen 8443;
    server_name api.predictatrade.com api-ipv4.predictatrade.com;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker embedded DNS — re-resolve upstream service names every 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_control   http://control:13080;
    set $upstream_control_b http://control-b:13080;
    set $upstream_realtime  http://realtime:13081;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    # Rate limiting
    limit_req zone=api burst=60 nodelay;
    limit_conn conn_per_ip 10;

    # ─── Health endpoint (NestJS) — HA failover to control-b ───
    location = /api/v1/health {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }

    # ─── Go realtime HTTP API ───
    # POST /ingest/agent — EA-direct market-data ingest (Option B, v1.19.0).
    location /ingest/agent {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        proxy_intercept_errors on;
        error_page 502 503 504 = @realtime_retry;
    }

    location /api/v1/signals      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/trades       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/market       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/candles      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/strategies   { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/agents       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/pipeline     { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/liquidity    { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/cross-market { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/engines      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/feeds        { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; }
    location /api/v1/news         { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/astro/       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/devil-liquidity { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/admin/regime-diagnostics { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/admin/signal-engine      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/system-health { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }

    # ─── NestJS control plane endpoints ───
    location /api/v1/telemetry/   { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/audit/events { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/auth/        { limit_req zone=auth burst=40 nodelay; proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/device-auth/ { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/subscriptions{ proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/admin/       { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/operations/  { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/licensing/   { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
        location /api/v1/billing/     { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }

    # ─── Backtest long-run budget (330s) with control-b failover ───
    location /api/v1/backtest/run {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b_bt;
    }

    location @control_b_bt {
        proxy_pass $upstream_control_b;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream off;
    }

    # ─── All other API routes → NestJS (with HA failover) ───
    location /api/v1/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }
    location @control_b {
        proxy_pass $upstream_control_b;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }
    location @realtime_retry {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }

    # ─── WebSocket — browser dashboard relay ───
    location /ws {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
        limit_conn conn_per_ip 5;
    }

    # Block non-API paths
    location / {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"service":"Predict-A-Trade API","version":"1.0.0","status":"ok"}';
    }

    location /api/docs {
        return 404;
    }

    access_log /var/log/nginx/api.predictatrade.com.access.log;
    error_log /var/log/nginx/api.predictatrade.com.error.log warn;
}