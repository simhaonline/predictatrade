# Gitleaks configuration for Predict-A-Trade XAUUSD
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

# Allowlist: known development-only test fixtures and non-secret patterns.
# These are intentionally excluded from secret scanning because they are
# development/local-test credentials that are NOT used in production.
# Gitleaks v8 expects one allowlist table, not repeated [[allowlist]] arrays.

[allowlist]
description = "Known development-only fixtures and non-secret templates"
regexes = [
  '''pat_local_dev_only''',
]
paths = [
  '''realtime/internal/config/config_test\.go''',
  '''control/src/common/__tests__/security-validation\.spec\.ts''',
  '''infra/env/.*\.env\.example''',
  '''mcp\.env\.example''',
  '''scripts/verify_math_parity\.py''',
  '''scripts/train_ml_model\.py''',
]
