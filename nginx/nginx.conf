# ============================================================
# Predict-A-Trade v1.0.0 — Main Nginx Configuration
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    # Basic
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request ID and correlation ID
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'request_id=$request_id '
                    'correlation_id=$http_x_correlation_id '
                    'upstream_addr=$upstream_addr '
                    'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;

    # Rate limiting zones
    include /etc/nginx/snippets/rate-limit.conf;

    # SSL defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CORS origin allowlist — echoes the request Origin only if allowed.
    # Used by snippets/cors-edge.conf; unknown origins resolve to "" which
    # makes add_header emit nothing (fail closed).
    map $http_origin $cors_allow_origin {
        default                                  "";
        "https://platform.predictatrade.com"     $http_origin;
        "https://live.predictatrade.com"         $http_origin;
        "https://api.predictatrade.com"          $http_origin;
        "https://predictatrade.com"              $http_origin;
        "https://www.predictatrade.com"          $http_origin;
    }

    # Include site configurations
    include /etc/nginx/sites-available/*.conf;
}
