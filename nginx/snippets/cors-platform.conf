# CORS snippet: allows platform.predictatrade.com to access API endpoints
# Include this in any location block that needs cross-origin access
# Handles both regular responses and OPTIONS preflight
add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-Id, X-Device-Id" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Max-Age 86400 always;
