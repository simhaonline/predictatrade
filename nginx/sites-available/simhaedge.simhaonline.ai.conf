# SimhaEdge AI — full edge conf: ACME (renewals) + HTTPS on the shared pat-nginx.
# Single SAN cert (api.simhaonline.ai covers all 6 FQDNs); modern http2 syntax.

# ---- port 80: ACME challenge + redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name api.simhaonline.ai portal.simhaonline.ai admin.simhaonline.ai docs.simhaonline.ai status.simhaonline.ai workflow.simhaonline.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: API gateway ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.simhaonline.ai;

    ssl_certificate     /etc/letsencrypt/live/api.simhaonline.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.simhaonline.ai/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 26m;
    }
}

# ---- HTTPS: portal ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.simhaonline.ai;

    ssl_certificate     /etc/letsencrypt/live/api.simhaonline.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.simhaonline.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

