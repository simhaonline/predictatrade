# ============================================================
# api.predictatrade.com — Backend API
# Serves: NestJS control plane REST API + Go HTTP API (signals/market)
# Upstream: 127.0.0.1:13080 (NestJS), 127.0.0.1:13081 (Go realtime HTTP)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/api.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # No CSP for API — it serves JSON, not HTML
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS headers (handled by NestJS app, but set here for OPTIONS preflight)
    # NestJS handles CORS in application code with explicit origins

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_per_ip 10;

    # Health endpoint (NestJS)
    location = /api/v1/health {
        proxy_pass http://pat-control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
        limit_req zone=general burst=50 nodelay;
    }

    # NestJS Control Plane — all /api/v1/ routes EXCEPT signals/market/strategies
    # Go realtime HTTP API serves signals, market state, candles, strategies
    location /api/v1/signals {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/v1/market {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/v1/candles {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/v1/strategies {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://pat-control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # All other API routes → NestJS
    location /api/v1/price {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/v1/agents {
        include /etc/nginx/snippets/go-engine-cors.conf;
        proxy_pass http://pat-realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }
    location /api/v1/ {
        proxy_pass http://pat-control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Block non-API paths — no public frontend fallback
    location / {
        default_type application/json;
        return 200 '{"service":"Predict-A-Trade API","version":"1.0.0","endpoints":{"health":"/api/v1/health","plans":"/api/v1/plans","auth":"/api/v1/auth"},"status":"ok"}';
    }

    # Block Swagger docs in production
    location /api/docs {
        # Allow only from specific IPs if needed
        # allow 10.0.0.0/8; deny all;
        return 404;
    }

    access_log /var/log/nginx/api.predictatrade.com.access.log;
    error_log /var/log/nginx/api.predictatrade.com.error.log warn;
}
