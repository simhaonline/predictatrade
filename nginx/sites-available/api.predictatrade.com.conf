# ============================================================
# api.predictatrade.com — Backend API
# Serves: NestJS control plane REST API + Go HTTP API (signals/market)
# Upstream: control:13080 (NestJS), realtime:13081 (Go realtime HTTP)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/api.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_per_ip 10;

    # Health endpoint (NestJS)
    location = /api/v1/health {
        proxy_pass http://control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
        limit_req zone=general burst=50 nodelay;
    }

    # Go realtime HTTP API — with CORS headers for cross-origin access from platform.predictatrade.com
    # The Go engine doesn't return CORS headers, so nginx adds them here
    location /api/v1/signals {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        # CORS: allow platform.predictatrade.com to read the response
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        # Handle preflight OPTIONS
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/v1/market {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/v1/candles {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/v1/strategies {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/v1/agents {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/v1/liquidity {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /api/v1/admin/regime-diagnostics {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /api/v1/system-health {
        proxy_pass http://realtime:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Compliance telemetry endpoint (rate limited in NestJS)
    location /api/v1/compliance/ {
        proxy_pass http://control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # All other API routes → NestJS
    location /api/v1/ {
        proxy_pass http://control:13080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Block non-API paths
    location / {
        default_type application/json;
        return 200 '{"service":"Predict-A-Trade API","version":"1.0.0","status":"ok"}';
    }

    # Block Swagger docs in production
    location /api/docs {
        return 404;
    }

    access_log /var/log/nginx/api.predictatrade.com.access.log;
    error_log /var/log/nginx/api.predictatrade.com.error.log warn;
}
