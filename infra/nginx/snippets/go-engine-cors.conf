# ============================================================
# Predict-A-Trade — CORS for Go Engine Routes
# The Go engine does not handle CORS itself (unlike NestJS).
# This snippet adds CORS headers for the authorized frontend origin
# and handles OPTIONS preflight without forwarding to the Go engine.
# ============================================================

# Authorized production frontend origin
# Only respond with CORS headers for this specific origin
# Never use wildcard (*) with credentialed requests

# Handle OPTIONS preflight directly at nginx — don't forward to Go engine
if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' 'https://platform.predictatrade.com' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID, X-Correlation-Id' always;
    add_header 'Access-Control-Max-Age' 86400 always;
    add_header 'Vary' 'Origin' always;
    add_header 'Content-Type' 'text/plain; charset=utf-8';
    add_header 'Content-Length' 0;
    return 204;
}

# For actual GET/POST/etc requests, add CORS headers
add_header 'Access-Control-Allow-Origin' 'https://platform.predictatrade.com' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Expose-Headers' 'X-Correlation-Id' always;
add_header 'Vary' 'Origin' always;
