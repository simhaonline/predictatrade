# ============================================================
# platform.predictatrade.com — Authenticated Application
# Serves: Next.js user portal + admin console
# Upstream: 127.0.0.1:13082 (Next.js)
# Realtime WS: NOT proxied here — goes to live.predictatrade.com
# ============================================================

server {
 listen 80;
 listen [::]:80;
 server_name platform.predictatrade.com;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name platform.predictatrade.com;

 ssl_certificate /etc/letsencrypt/live/platform.predictatrade.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/platform.predictatrade.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
 ssl_prefer_server_ciphers off;
 ssl_session_cache shared:SSL:10m;
 ssl_session_timeout 1d;

 # Security headers
 include /etc/nginx/snippets/security-headers.conf;

 # CSP — platform app (allows API + WS connections)
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.predictatrade.com wss://live.predictatrade.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

 gzip on;
 gzip_types text/plain text/css application/json application/javascript text/xml;
 gzip_min_length 1024;

 client_max_body_size 10m;

 # Static assets
 location /_next/static/ {
 proxy_pass http://127.0.0.1:13082;
 include /etc/nginx/snippets/proxy-common.conf;
 expires 365d;
 add_header Cache-Control "public, immutable";
 }

 # Next.js internal API routes (if any)
 location /_next/data/ {
 proxy_pass http://127.0.0.1:13082;
 include /etc/nginx/snippets/proxy-common.conf;
 }

 # Block direct API proxying — API calls go to api.predictatrade.com
 # Block direct WebSocket — WS goes to live.predictatrade.com
 location /ws {
 return 301 https://live.predictatrade.com$request_uri;
 }

 # Main proxy to Next.js
 location / {
 proxy_pass http://127.0.0.1:13082;
 include /etc/nginx/snippets/proxy-common.conf;
 }

 access_log /var/log/nginx/platform.predictatrade.com.access.log;
 error_log /var/log/nginx/platform.predictatrade.com.error.log warn;
}
