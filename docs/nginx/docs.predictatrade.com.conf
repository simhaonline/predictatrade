# ─── docs.predictatrade.com ───
# Predict-A-Trade Documentation — Self-Hosted Docsify
# NOTE: HTTPS is NOT enabled until certbot obtains the certificate.
#       1) Deploy this config with HTTPS commented
#       2) Run: sudo certbot certonly --webroot -w /var/www/certbot -d docs.predictatrade.com
#       3) Uncomment lines 55-76 + line 16, then reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name docs.predictatrade.com;

    # Certbot ACME challenge — MUST be accessible on HTTP port 80 without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve docs (HTTP only until SSL is set up)
    root /var/www/pat-docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown;
    gzip_min_length 256;
    gzip_vary on;
}

