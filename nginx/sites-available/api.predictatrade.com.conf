# ============================================================
# api.predictatrade.com — Backend API
# Serves: NestJS control plane REST API + Go HTTP API (signals/market)
# Upstream: control:13080 (NestJS), realtime:13081 (Go realtime HTTP)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/api.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker embedded DNS — re-resolve upstream service names every 10s.
    # Without this, nginx caches container IPs at startup and returns 502
    # after any backend container is rebuilt/recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HA (2026-09-04): control runs as TWO instances (pat-control +
    # pat-control-b). proxy_next_upstream (in snippets/proxy-common.conf)
    # retries the peer when one is down/restarting, so MT-client edge-poll
    # never sees a 502 during deploys or crashes. Docker DNS returns both
    # A records for `control`; nginx load-balances across them per request.
    # max_fails/fail_timeout via upstream block is not possible with the
    # variable form, so dead-peer retry is handled purely by
    # proxy_next_upstream + short connect timeout.
    set $upstream_control http://control:13080;
    set $upstream_realtime http://realtime:13081;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    # Rate limiting
    limit_req zone=api burst=60 nodelay;
    limit_conn conn_per_ip 10;

    # ─── Health endpoint (NestJS) ───
    # HA failover (2026-09-04): on 502/503/504/timeouts, internally retry the
    # SAME URI against the control-b peer. nginx's variable proxy_pass
    # resolves `control` to ONE address per request and does not iterate A
    # records, so proxy_next_upstream alone cannot reach the second replica;
    # the error_page internal redirect covers exactly that gap.
    location = /api/v1/health {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }

    # ─── Go realtime HTTP API ───
    # POST /ingest/agent — EA-direct market-data ingest (Option B, v1.19.0).
    # Replaces the removed /ws/v1/agent WebSocket transport: Master (data) EAs
    # POST ticks/snapshots here with a device JWT; the engine's processing
    # pipeline is unchanged. Higher rate allowance — one POST per tick.
    location /ingest/agent {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        # HA (2026-09-04): realtime is a stateful singleton — a second engine
        # instance would split in-memory candle/strategy state, so there is no
        # failover peer. During a realtime deploy the container is briefly
        # absent and a tick POST can 502. Retry ONCE via internal redirect:
        # the named location re-resolves Docker DNS (valid=10s) and reconnects,
        # covering the container-recreate gap. If the engine is still down the
        # EA's next per-tick POST succeeds — ticks are per-tick idempotent.
        proxy_intercept_errors on;
        error_page 502 503 504 = @realtime_retry;
    }

    location /api/v1/signals {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/trades {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/market {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/candles {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/strategies {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/agents {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Pipeline Monitor (Go engine) — real-time Signal -> Risk -> Execution -> Review
    location /api/v1/pipeline {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/liquidity {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/cross-market {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/engines {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # ─── Devil Liquidity / Devil's Mark engine (Go realtime) ───
    location /api/v1/feeds {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/v1/news {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/astro/ {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location /api/v1/devil-liquidity {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location = /api/v1/admin/regime-diagnostics {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location = /api/v1/admin/signal-engine {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    location = /api/v1/system-health {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # ─── NestJS control plane endpoints ───
    # Telemetry endpoint (rate limited in NestJS)
    location /api/v1/telemetry/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Audit events endpoint (admin only)
    location /api/v1/audit/events {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Auth endpoints — stricter rate limit (but permissive enough for login +
    # session-restore + proactive refresh traffic; was burst=5 and blocked login)
    location /api/v1/auth/ {
        limit_req zone=auth burst=40 nodelay;
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Device auth endpoints
    location /api/v1/device-auth/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Subscriptions endpoints (includes PATCH /strategies)
    location /api/v1/subscriptions {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Admin endpoints
    location /api/v1/admin/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Operations state endpoint
    location /api/v1/operations/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Licensing endpoints
    location /api/v1/licensing/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Referral endpoints
    location /api/v1/referral/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # Billing endpoints
    location /api/v1/billing/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
    }

    # All other API routes → NestJS (with CORS)
    # Backtest runs are synchronous engine executions (up to 300s for large
    # ranges) — needs its own long proxy timeouts, the generic 30s read
    # timeout 504s on anything that takes longer than half a minute.
    location /api/v1/backtest/run {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b_bt;
    }

    # Dedicated backtest failover peer (330s to match the run budget)
    location @control_b_bt {
        proxy_pass http://control-b:13080;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream off;
    }

    location /api/v1/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        # HA failover to control-b on upstream failure (edge-poll etc.)
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }

    # HA peer fallback (2026-09-04): internally re-dispatch the original
    # request to the control-b instance when the primary errored. Read
    # timeout matches the backtest 330s budget so a failed-over backtest
    # run still has its full window on the peer.
    location @control_b {
        proxy_pass http://control-b:13080;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }

    # Realtime ingest retry (2026-09-04): see /ingest/agent above. The named
    # location re-executes the ORIGINAL URI against $upstream_realtime with a
    # fresh DNS resolve — the same-upstream retry nginx cannot do in one pass.
    location @realtime_retry {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }

    # ─── WebSocket — EA-direct HTTPS transport (Option B, v1.19.0) ───
    # The Windows-agent WS endpoints (/ws/v1/agent, /ws/v1/data) are REMOVED.
    # EAs now use:
    #   POST /ingest/agent            → Go realtime (market-data ingest, JWT)
    #   POST /api/v1/devices/*        → NestJS control (edge-poll/ack/heartbeat, HMAC)
    # Both are routed by the generic /api/v1 and /ingest locations above/below.

    location /ws {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
        limit_conn conn_per_ip 5;
    }

    # Block non-API paths
    location / {
        default_type application/json;
        return 200 '{"service":"Predict-A-Trade API","version":"1.0.0","status":"ok"}';
    }

    # Block Swagger docs in production
    location /api/docs {
        return 404;
    }

    access_log /var/log/nginx/api.predictatrade.com.access.log;
    error_log /var/log/nginx/api.predictatrade.com.error.log warn;
}
