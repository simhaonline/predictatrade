# ============================================================
# nginx/plesk/origin-8443.conf — Plesk-facing origin edge listener
# ============================================================
# Plesk (separate server) terminates public TLS and reverse-proxies here:
#   CF (TLS) → Plesk (TLS) → origin :8443 (HTTP) → containers
# One HTTP server block per domain, mirroring the 443 site configs minus TLS.
# Firewall :8443 to the Plesk server IP ONLY (infra/env/.env PLESK_SERVER_IP).
# ============================================================

# ─── api.predictatrade.com — Backend API ───
server {
    listen 8443;
    server_name api.predictatrade.com;

    # Plesk hop real client IP: Plesk forwards X-Forwarded-For (appended
    # chain). CF orange: XFF=[CF-edge, client] → recursive walk lands on the
    # client. CF off (grey): XFF=[client]. Server context overrides the
    # http-level real_ip_header CF-Connecting-IP (which only matches when a
    # CF header exists — absent on the grey-cloud path).
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_control   http://control:13080;
    set $upstream_control_b http://control-b:13080;
    set $upstream_realtime  http://realtime:13081;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    limit_req zone=api burst=60 nodelay;
    limit_conn conn_per_ip 10;

    location = /api/v1/health {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }

    location /ingest/agent {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        limit_req zone=general burst=100 nodelay;
        proxy_intercept_errors on;
        error_page 502 503 504 = @realtime_retry;
    }

    # P0-3 (prompt.md): raw indicator reads → Go engine (same builder as feature snapshots)
    location /api/v1/indicators/raw { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }

    # v1.32 (10k+ subscribers): EA-direct device transport (edge-poll/activate/
    # refresh/heartbeat, HMAC-authenticated) — NO per-IP rate limit here: every
    # subscriber arrives via this one edge, so per-IP limits would 429 the whole
    # fleet. Per-device abuse control = HMAC + DeviceAuthService (timestamp
    # window, nonce replay, revocation) + app-level SkipThrottle.
    location /api/v1/devices/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }

    location /api/v1/signals      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/trades       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/market       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/candles      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/strategies   { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/agents       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/pipeline     { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/liquidity    { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/cross-market { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/engines      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/feeds        { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; }
    location /api/v1/news         { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/astro/       { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/devil-liquidity { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/admin/regime-diagnostics { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/admin/signal-engine      { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location = /api/v1/system-health { proxy_pass $upstream_realtime; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }

    location /api/v1/telemetry/   { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/audit/events { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/auth/        { limit_req zone=auth burst=40 nodelay; proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/device-auth/ { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/subscriptions{ proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/admin/       { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/operations/  { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/licensing/   { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/referral/    { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }
    location /api/v1/billing/     { proxy_pass $upstream_control; include /etc/nginx/snippets/proxy-common.conf; include /etc/nginx/snippets/cors-edge.conf; }

    location /api/v1/backtest/run {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b_bt;
    }

    location @control_b_bt {
        proxy_pass $upstream_control_b;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_next_upstream off;
    }

    location /api/v1/ {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @control_b;
    }
    location @control_b {
        proxy_pass $upstream_control_b;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }
    location @realtime_retry {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        proxy_next_upstream off;
    }

    location /ws {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
        limit_conn conn_per_ip 5;
    }

    location / {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"service":"Predict-A-Trade API","version":"1.0.0","status":"ok"}';
    }

    location /api/docs {
        return 404;
    }

    access_log /var/log/nginx/api.predictatrade.com.access.log;
    error_log /var/log/nginx/api.predictatrade.com.error.log warn;
}

# ─── platform.predictatrade.com — Next.js portal + admin ───
server {
    listen 8443;
    server_name platform.predictatrade.com;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend http://frontend:13082;
    set $upstream_edge http://live-terminal:13090;
    set $upstream_engine http://realtime:13081;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.predictatrade.com https://live.predictatrade.com wss://live.predictatrade.com wss://platform.predictatrade.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass $upstream_frontend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/data/ {
        proxy_pass $upstream_frontend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /ws/v1/relay {
        proxy_pass $upstream_edge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass $upstream_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /downloads/ {
        alias /var/www/downloads/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass $upstream_frontend;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    access_log /var/log/nginx/platform.predictatrade.com.access.log;
    error_log /var/log/nginx/platform.predictatrade.com.error.log warn;
}

# ─── live.predictatrade.com — public live terminal + WS + engine API ───
server {
    listen 8443;
    server_name live.predictatrade.com;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_edge    "live-terminal:13090";
    set $upstream_engine  "realtime:13081";

    root /var/www/pat-live;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://live.predictatrade.com https://live.predictatrade.com; frame-ancestors 'self' https://predictatrade.com https://www.predictatrade.com" always;

    location = / {
        try_files /terminal.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /terminal.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(png|svg|ico|woff2?|min\.js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /terminal.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws {
        proxy_pass http://$upstream_edge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        limit_conn conn_per_ip 10;
    }

    location /api/v1/live-preview/ {
        proxy_pass http://$upstream_edge;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://$upstream_engine;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://$upstream_engine;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    access_log /var/log/nginx/live.predictatrade.com.access.log;
    error_log /var/log/nginx/live.predictatrade.com.error.log warn;
}

# ─── status.predictatrade.com — public status page ───
server {
    listen 8443;
    server_name status.predictatrade.com;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pat_status http://status:13083;
    set $upstream_control http://control:13080;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.predictatrade.com; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass $pat_status;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /api/v1/health {
        proxy_pass $upstream_control;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /metrics {
        return 404;
    }

    access_log /var/log/nginx/status.predictatrade.com.access.log;
    error_log /var/log/nginx/status.predictatrade.com.error.log warn;
}

# ─── downloads.predictatrade.com — EA binaries + sources ───
server {
    listen 8443;
    server_name downloads.predictatrade.com;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /mql/ {
        alias /var/www/mql/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        location ~ \.mq[45]$ {
            default_type text/plain;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }
    }

    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        location ~ \.ex[45]$ {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }
    }

    location = / {
        return 200 "downloads.predictatrade.com OK\n";
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/downloads.predictatrade.com.access.log;
    error_log /var/log/nginx/downloads.predictatrade.com.error.log warn;
}

# ─── docs.predictatrade.com — self-hosted Docsify docs ───
server {
    listen 8443;
    server_name docs.predictatrade.com;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/pat-docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown;
    gzip_min_length 256;
    gzip_vary on;

    access_log /var/log/nginx/docs.predictatrade.com.access.log;
    error_log /var/log/nginx/docs.predictatrade.com.error.log warn;
}
