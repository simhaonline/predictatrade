# ============================================================
# nginx/plesk/00-global.conf — Plesk GLOBAL nginx directives (http level)
# ============================================================
# Plesk panel path: Tools & Settings → Nginx Settings → paste into the
# "Additional nginx directives" box (applies server-wide to all vhosts),
# OR append to /etc/nginx/conf.d/zz-pat-proxy.conf on the Plesk server.
#
# REQUIRED on the Plesk server — WebSocket upgrade map (Plesk stock nginx
# does NOT define $connection_upgrade; without it the $connection_upgrade
# references in the vhost templates resolve to empty and WS upgrade fails):
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Plesk → Predict-A-Trade origin proxy tuning (all vhosts) ---
proxy_buffers 16 16k;
proxy_buffer_size 32k;

# Do not pass Plesk's server tokens to clients
server_tokens off;
