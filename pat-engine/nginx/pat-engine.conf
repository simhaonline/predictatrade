upstream pat_engine {
    server pat-engine:8080;
}

upstream pat_frontend {
    server pat-frontend:3000;
}

server {
    listen 80;
    server_name api.predictatrade.com localhost;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # REST API + signal endpoints -> Go engine
    location /api/ {
        proxy_pass http://pat_engine/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /bar {
        proxy_pass http://pat_engine/bar;
        proxy_set_header Host $host;
    }
    location /signal {
        proxy_pass http://pat_engine/signal;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://pat_engine/health;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js) — same origin, consumes /api/v1 relatively.
    location / {
        proxy_pass http://pat_frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
