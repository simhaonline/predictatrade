# ============================================================
# Predict-A-Trade — Rate Limiting Zones
# Define in nginx.conf http{} block
# ============================================================

# API rate limit: 30 req/s burst 60
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Auth rate limit: login/refresh/register — must allow the dashboard's
# session-restore + proactive-refresh traffic (2r/s burst 5 was 429-storming
# the live site and blocking login). 20r/s burst 40 is still abusive-traffic
# protective but permits normal + retry behaviour.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

# WebSocket connect rate limit
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

# General rate limit
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
