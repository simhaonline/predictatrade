# ============================================================
# api.predictatrade.com — Plesk vhost (TLS edge → origin :8443)
# Plesk terminates public TLS (Let's Encrypt via Plesk or Cloudflare Origin
# CA) and reverse-proxies to the Predict-A-Trade origin.
#
# Chain: CF (orange) → THIS PLESK (TLS) → origin 2.29.23.42:8443 (HTTP)
#
# Plesk install: Domains → api.predictatrade.com → Apache & nginx Settings →
#   check "Enable nginx-based proxying", paste the location-level directives
#   into "Additional nginx directives" (the server{} wrapper is added by
#   Plesk), then apply. If you manage raw vhost files instead, wrap the
#   location block in a server{} with the ssl_certificate lines from the
#   Plesk-generated vhost.
# ============================================================

# Plesk: keep the origin's HA behavior — no aggressive buffering of API
# responses, real proxy chain headers on every request.
proxy_buffering off;

location / {
    proxy_pass http://2.29.23.42:8443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Outer TLS truth for the backend (NestJS secure cookies, redirects)
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;

    # Preserve the CF-resolved client IP chain (CF-Connecting-IP passes
    # through automatically as a request header; XFF keeps the full chain)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    client_max_body_size 1m;

    # WebSocket upgrade for /ws (dashboard relay)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
