# ============================================================
# live.predictatrade.com — Plesk vhost (TLS edge → origin :8443)
# Public live terminal (static) + WebSocket + engine API.
# Chain: CF (orange) → THIS PLESK (TLS) → origin 2.29.23.42:8443 (HTTP)
#
# NOTE (WS): Cloudflare free plan cuts idle WebSockets at 100s. Plesk read
# timeout here must stay < 100s (75s used) or CF silently drops the socket
# mid-frame — same rule the origin nginx already follows.
# ============================================================

proxy_buffering off;

location / {
    proxy_pass http://2.29.23.42:8443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    client_max_body_size 10m;

    # WebSocket upgrade (/ws → live-terminal relay)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
