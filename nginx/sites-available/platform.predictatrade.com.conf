# ============================================================
# platform.predictatrade.com — Authenticated Application
# Serves: Next.js user portal + admin console
# Upstream: frontend:13082 (Next.js)
# Realtime WS: NOT proxied here — goes to live.predictatrade.com
# ============================================================

server {
 listen 80;
 listen [::]:80;
 server_name platform.predictatrade.com;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name platform.predictatrade.com;

 ssl_certificate /etc/letsencrypt/live/platform.predictatrade.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/platform.predictatrade.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
 ssl_prefer_server_ciphers off;
 ssl_session_cache shared:SSL:10m;
 ssl_session_timeout 1d;

 include /etc/nginx/snippets/security-headers.conf;

 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.predictatrade.com https://live.predictatrade.com wss://live.predictatrade.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

 # Docker embedded DNS — re-resolve upstream service names every 10s.
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $upstream_frontend http://frontend:13082;

 gzip on;
 gzip_types text/plain text/css application/json application/javascript text/xml;
 gzip_min_length 1024;

 client_max_body_size 10m;

 # Static assets — use no-cache so browser always revalidates
 # (was: immutable which caused stale chunks to persist forever)
 location /_next/static/ {
     proxy_pass $upstream_frontend;
     include /etc/nginx/snippets/proxy-common.conf;
     proxy_hide_header Cache-Control;
     add_header Cache-Control "no-cache, must-revalidate" always;
 }

 location /_next/data/ {
     proxy_pass $upstream_frontend;
     include /etc/nginx/snippets/proxy-common.conf;
     proxy_hide_header Cache-Control;
     add_header Cache-Control "no-cache, no-store, must-revalidate" always;
 }

 location /ws {
     proxy_pass http://pat-realtime:13081;
     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection "upgrade";
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     proxy_connect_timeout 10s;
     proxy_send_timeout 300s;
     proxy_read_timeout 300s;
     proxy_buffering off;
 }

 # Main proxy — HTML pages must never be cached
 location / {
     proxy_pass $upstream_frontend;
     include /etc/nginx/snippets/proxy-common.conf;
     proxy_hide_header Cache-Control;
     add_header Cache-Control "no-cache, no-store, must-revalidate" always;
     add_header Pragma "no-cache" always;
 }

 access_log /var/log/nginx/platform.predictatrade.com.access.log;
 error_log /var/log/nginx/platform.predictatrade.com.error.log warn;
}
