# ============================================================
# Predict-A-Trade — Shared Proxy Headers Snippet
# ============================================================

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Correlation-Id $http_x_correlation_id;
proxy_http_version 1.1;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Proxy buffer settings — prevents "upstream response is buffered to
# a temporary file" warnings for larger JS/CSS chunks
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
proxy_set_header Connection "";

# HA retry (2026-09-04): if the chosen upstream errors/timeouts/502s/503s,
# transparently retry the next peer in the upstream pool. Keeps MT-client
# edge-poll (and every API route) alive through single-instance restarts.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 15s;
