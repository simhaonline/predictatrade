# ============================================================
# predictatrade.com — Public Website
# NOTE: predictatrade.com and www are hosted on a separate Plesk server.
# This config only exists to handle the case where traffic somehow
# reaches this server for predictatrade.com — it redirects to the
# canonical HTTPS URL. The Plesk server is the real origin.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name predictatrade.com www.predictatrade.com;

    # ACME challenge (Let's Encrypt — for subdomains on this server)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (handled by Plesk server in production)
    location / {
        return 301 https://$host$request_uri;
    }
}

# No 443 block for predictatrade.com — it's served by the Plesk server.
# If traffic accidentally hits this server on 443 for predictatrade.com,
# it will get the default server's certificate (platform cert with SAN).
# That's acceptable as a fallback since DNS normally points to Plesk.
