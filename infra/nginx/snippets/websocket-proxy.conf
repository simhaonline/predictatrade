# ============================================================
# Predict-A-Trade — WebSocket Proxy Snippet
# For live.predictatrade.com realtime connections
# ============================================================

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

# Long timeouts for realtime connections
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# Disable buffering for realtime
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# No rate limiting on established WS (handled at connect)
limit_req zone=ws burst=10 nodelay;
