upstream pat_engine {
    server pat-engine:8080;
}

server {
    listen 80;
    server_name api.predictatrade.com localhost;

    # CORS (frontend on same domain in prod; open for dev)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location /api/ {
        proxy_pass http://pat_engine/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend mounts here later (control-plane build output).
    location / {
        # return 200 'pat-engine backend OK';  # placeholder until frontend is built
        proxy_pass http://pat_engine/health;
    }
}
