# ============================================================
# downloads.predictatrade.com — Plesk vhost (TLS edge → origin :8443)
# EA downloads (.ex4/.ex5 + .mq4/.mq5 sources).
# Chain: CF (orange) → THIS PLESK (TLS) → origin 2.29.23.42:8443 (HTTP)
#
# Binary downloads: buffering on is fine, but raise timeouts so large files
# over slow mobile links do not get cut by the Plesk default.
# ============================================================

location / {
    proxy_pass http://2.29.23.42:8443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
}
