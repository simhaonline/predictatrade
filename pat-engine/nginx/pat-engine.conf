upstream pat_engine {
    server pat-engine:8080;
}

upstream pat_frontend {
    server pat-engine-frontend:3000;
}

# HTTP — redirect to HTTPS (TLS terminated below).
server {
    listen 80;
    listen [::]:80;
    server_name api.predictatrade.com localhost;

    # ACME / cert-renewal challenge (if ever needed).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination for the new pat-engine project.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.predictatrade.com localhost;

    ssl_certificate     /etc/letsencrypt/live/api.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.predictatrade.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # REST API + signal endpoints -> Go engine
    # NOTE: no trailing slash on proxy_pass — preserve the full /api/v1/... path.
    location /api/ {
        proxy_pass http://pat_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /bar {
        proxy_pass http://pat_engine/bar;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /signal {
        proxy_pass http://pat_engine/signal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://pat_engine/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js) — same origin, consumes /api/v1 relatively.
    location / {
        proxy_pass http://pat_frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
