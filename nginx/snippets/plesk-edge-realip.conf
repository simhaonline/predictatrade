# ============================================================
# nginx/snippets/plesk-edge-realip.conf — trust the Plesk edge
# ============================================================
# The Plesk server (separate box) is now the outer proxy hop:
#   CF (TLS) → Plesk (TLS) → origin :8443 (HTTP) → containers
#
# cloudflare-realip.conf (included in http{} of nginx.conf) already restores
# the true client IP from CF-Connecting-IP — but it only TRUSTS Cloudflare
# ranges. Once traffic arrives from the Plesk server, $remote_addr on the
# origin is the PLESK IP, so real_ip from CF-Connecting-IP would be refused
# and every rate-limit zone would key on the single Plesk edge IP (locking
# out ALL users at once).
#
# Fix: also trust the Plesk edge as a real_ip source. Both snippets are
# included from nginx.conf http{}.
#
# OPERATION: replace __PLESK_SERVER_IP__ with the Plesk server's public IP
# (the same IP Hetzner firewall must allow on :8443). Keep this file in sync
# if the Plesk server ever changes.
# ============================================================

set_real_ip_from __SET_PLESK_SERVER_PUBLIC_IP__;

# Plesk forwards the chain "CF-Connecting-IP" as its own X-Forwarded-For
# entry; with recursive on, real_ip walks back to the first untrusted
# address, which is the real client (CF already resolved it).
real_ip_recursive on;