# ============================================================
# license.predictatrade.com — License API (direct origin TLS)
# Serves: Go license-server (activate / heartbeat / stripe webhook)
# Upstream: 152.53.67.111:12312 (docker compose in Predict-A-Trade/license-server)
# Purpose: SECOND, INDEPENDENT frontend for the license API so MT5 clients
#          fail over automatically if the Plesk-terminated primary
#          (license.predictatrade.com) path is broken by a middlebox.
# ============================================================

server {
 listen 80;
 listen [::]:80;
 server_name license2.predictatrade.com;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

#TEMP# 
#TEMP#  listen [::]:443 ssl;
#TEMP#  server_name license2.predictatrade.com;
#TEMP# 
#TEMP#  ssl_certificate /etc/letsencrypt/live/license2.predictatrade.com/fullchain.pem;
#TEMP#  ssl_certificate_key /etc/letsencrypt/live/license2.predictatrade.com/privkey.pem;
#TEMP#  ssl_protocols TLSv1.2 TLSv1.3;
#TEMP#  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
#TEMP#  ssl_prefer_server_ciphers off;
#TEMP#  ssl_session_cache shared:SSL2:10m;
#TEMP#  ssl_session_timeout 1d;
#TEMP# 
#TEMP#  # API only: JSON bodies are tiny, no compression needed, generous keepalive
#TEMP#  client_max_body_size 64k;
#TEMP# 
#TEMP#  location / {
#TEMP#      proxy_pass http://152.53.67.111:12312;
#TEMP#      proxy_http_version 1.1;
#TEMP#      proxy_set_header Host $host;
#TEMP#      proxy_set_header X-Forwarded-Proto https;
#TEMP#      proxy_set_header X-Real-IP $remote_addr;
#TEMP#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#TEMP#      proxy_connect_timeout 10s;
#TEMP#      proxy_send_timeout 15s;
#TEMP#      proxy_read_timeout 15s;
#TEMP#  }
#TEMP# 
#TEMP#  access_log /var/log/nginx/license2.predictatrade.com.access.log;
#TEMP#  error_log /var/log/nginx/license2.predictatrade.com.error.log warn;
#TEMP# }