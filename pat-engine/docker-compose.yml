# pat-engine infrastructure (docker-first, no systemd).
# Dedicated TimescaleDB (database: pat_engine) + Valkey for the signal engine.
# Ports are offset (5433 / 6380) to avoid clashing with the main project stack.
services:
  pat-engine-db:
    image: timescale/timescaledb:2.14.0-pg15
    container_name: pat-engine-db
    environment:
      POSTGRES_DB: pat_engine
      POSTGRES_USER: pat
      POSTGRES_PASSWORD: ${PAT_DB_PASSWORD:-pat_engine_dev}
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - pat_engine_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pat -d pat_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  pat-engine-cache:
    image: valkey/valkey:7.2
    container_name: pat-engine-cache
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pat-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pat-engine
    depends_on:
      pat-engine-db:
        condition: service_healthy
      pat-engine-cache:
        condition: service_healthy
    environment:
      PAT_DB_DSN: postgres://pat:${PAT_DB_PASSWORD:-pat_engine_dev}@pat-engine-db:5432/pat_engine
      PAT_REDIS_URL: redis://pat-engine-cache:6379
      PAT_LICENSE: ${PAT_LICENSE:-}
      PAT_LICENSE_SECRET: ${PAT_LICENSE_SECRET:-}
      PORT: "8080"
      SIGNAL_FILE: /data/PAT_signals.txt
    ports:
      - "8080:8080"
    volumes:
      - pat_engine_data:/data

volumes:
  pat_engine_pgdata:
  pat_engine_data:
