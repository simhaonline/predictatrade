# ============================================================
# live.predictatrade.com — Realtime/Edge Domain
# Serves: WebSocket signal streams, market data, agent connections
# Upstream: 127.0.0.1:13081 (Go WS), 127.0.0.1:13081 (Go HTTP)
# Optimized for long-lived realtime connections
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name live.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/live.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No caching for realtime responses
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # WebSocket connections — primary route
    # wss://live.predictatrade.com/ws/v1
    location /ws {
        # WebSocket upgrade
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/websocket-proxy.conf;

        # Connection rate limit
        limit_conn conn_per_ip 5;
    }

    # HTTP API for realtime data (signals, market state, candles)
    location /api/v1/signals {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/market {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/candles {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }

    # Health check (for monitoring)
    location = /health {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        limit_req zone=general burst=50 nodelay;
    }

    # Block all non-realtime paths
    location / {
        default_type application/json;
        return 200 '{"service":"Predict-A-Trade Realtime Gateway","version":"1.0.0","endpoints":{"health":"/health","websocket":"/ws/v1","market":"/api/v1/market/state"},"status":"ok"}';
    }

    access_log /var/log/nginx/live.predictatrade.com.access.log;
    error_log /var/log/nginx/live.predictatrade.com.error.log warn;
}
