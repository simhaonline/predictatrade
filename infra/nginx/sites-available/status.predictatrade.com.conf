# ============================================================
# status.predictatrade.com — Public Status Page
# Serves: Safe health aggregation (no secrets/internal metrics)
# Upstream: 127.0.0.1:13083 (status app) or NestJS health endpoint
# ============================================================

server {
 listen 80;
 listen [::]:80;
 server_name status.predictatrade.com;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name status.predictatrade.com;

 ssl_certificate /etc/letsencrypt/live/status.predictatrade.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/status.predictatrade.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
 ssl_prefer_server_ciphers off;
 ssl_session_cache shared:SSL:10m;
 ssl_session_timeout 1d;

 include /etc/nginx/snippets/security-headers.conf;

 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.predictatrade.com; frame-ancestors 'none'" always;

 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

 # Status page — proxies to NestJS health endpoint (safe read-only)
 # In production: serve a dedicated status app at 127.0.0.1:13083
 location / {
 proxy_pass http://127.0.0.1:13083;
 include /etc/nginx/snippets/proxy-common.conf;
 }

 # If no dedicated status app, fall back to NestJS health
 location = /api/v1/health {
 proxy_pass http://127.0.0.1:13080/api/v1/health;
 include /etc/nginx/snippets/proxy-common.conf;
 }

 # Block /metrics — internal Prometheus only
 location /metrics {
 return 404;
 }

 access_log /var/log/nginx/status.predictatrade.com.access.log;
 error_log /var/log/nginx/status.predictatrade.com.error.log warn;
}
