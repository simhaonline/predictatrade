# ============================================================
# live.predictatrade.com — Realtime/Edge Domain
# Serves: Public live dashboard (view-only), WebSocket, HTTP API
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name live.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/live.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — allow WS connections to self
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://live.predictatrade.com https://live.predictatrade.com; frame-ancestors 'none'" always;

    # Public live dashboard (view-only, no auth)
    # Public live dashboard (view-only, no auth)
    location = / {
        root /var/www/pat-live;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # PWA manifest
    location = /manifest.json {
        root /var/www/pat-live;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/manifest+json" always;
    }

    # Service worker — no cache (always latest version)
    location = /sw.js {
        root /var/www/pat-live;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/javascript" always;
    }

    # Static files (ECharts, favicon, logos, icons) — self-hosted, no CDN
    location ~* \.(js|css|svg|ico|png|jpg|jpeg|woff|woff2|ttf|json)$ {
        root /var/www/pat-live;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # WebSocket connections — primary route
    # WebSocket — Windows Agent (server-to-server, no connection limit)
    location /ws/v1/agent {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/websocket-proxy.conf;
    }

    location /ws {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/websocket-proxy.conf;
        limit_conn conn_per_ip 5;
    }

    # HTTP API for realtime data
    location /api/v1/signals {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/v1/market {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/v1/candles {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/v1/agents {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/v1/strategies {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/v1/price {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://platform.predictatrade.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:13081/health;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Health check (for monitoring)
    location = /health {
        proxy_pass http://127.0.0.1:13081;
        include /etc/nginx/snippets/proxy-common.conf;
    }


    # WhatsApp QR code page (served from static files, auto-refreshed)
    location = /whatsapp-qr.html {
        root /var/www/pat-live;
        add_header Cache-Control "no-store, no-cache" always;
    }

    location = /whatsapp-qr.png {
        root /var/www/pat-live;
        add_header Cache-Control "no-store, no-cache" always;
    }

    access_log /var/log/nginx/live.predictatrade.com.access.log;
    error_log /var/log/nginx/live.predictatrade.com.error.log warn;
}
