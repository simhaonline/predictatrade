# ============================================================
# downloads.predictatrade.com — Windows Agent Download Server
# Serves: agent.exe, nssm.exe (win32/win64), install/uninstall scripts
# SSL: Let's Encrypt (auto-renewed by certbot)
# ============================================================

# HTTP — redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name downloads.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — serves the deploy directory at /windows-agent/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/downloads.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Main download location — serves files from deploy/ directory
    location /windows-agent/ {
        alias /var/www/pat-deploy/;

        autoindex off;

        # MIME types for download files
        location ~ \.ps1$ {
            default_type text/plain;
            add_header Content-Disposition "inline" always;
        }
        location ~ \.bat$ {
            default_type text/plain;
            add_header Content-Disposition "inline" always;
        }
        location ~ \.json$ {
            default_type application/json;
        }
        location ~ \.md$ {
            default_type text/plain;
        }
        location ~ \.exe$ {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
        }

        # Cache scripts for 5 minutes, no cache for executables
        location ~ \.(ps1|bat|json)$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300" always;
        }
    }

    # Health check
    location = / {
        return 200 "downloads.predictatrade.com OK\n";
        add_header Content-Type text/plain;
    }
}
