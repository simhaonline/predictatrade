# ============================================================
# status.predictatrade.com — Plesk per-domain nginx directives
# ============================================================
# HOW TO INSTALL (per domain, nothing global, nothing else needed):
#   Plesk → Domains → status.predictatrade.com → Apache & nginx Settings
#   → "Additional nginx directives" → paste this entire file → OK → Apply
#
# Plesk owns listen / ssl_certificate / server_name — intentionally absent.
# Fully standalone: no includes, no map, no global directives, no files.
# Upstream: Predict-A-Trade origin (Docker pat-nginx), plain HTTP :8443.
# ============================================================

client_max_body_size 1m;

location / {
    proxy_pass http://2.29.23.42:8443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
}