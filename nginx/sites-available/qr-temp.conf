server {
    listen 80;
    listen 443 ssl;
    server_name qr.predictatrade.com;
    
    # Use existing SSL certs from platform
    ssl_certificate /etc/letsencrypt/live/platform.predictatrade.com/cert.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.predictatrade.com/privkey.pem;
    
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
