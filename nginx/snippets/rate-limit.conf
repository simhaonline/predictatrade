# ============================================================
# Predict-A-Trade — Rate Limiting Zones
# UNUSED since 2026-09-18 (operator decision): nginx per-IP rate limiting was
# removed from all vhosts — with CF grey-cloud → Plesk → origin, every client
# shares ONE remote_addr at the origin, so per-IP zones can only 429 the whole
# subscriber fleet. Abuse control lives in the application layers (HMAC device
# auth, DeviceAuthService bounds, NestJS Throttler, JWT verification).
# Zones retained only so any stray `limit_req` reference still resolves.
# ============================================================

# API rate limit: 30 req/s burst 60
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# edge-transport: EA-direct device traffic (edge-poll/ack/heartbeat + ingest).
# Sized for 10k+ subscribers at ~1 poll/3s per device (~3.3k r/s fleet-level).
# NOT per-client (all clients arrive via the single Plesk edge IP); real
# per-device abuse control = HMAC device auth + app-level SkipThrottle bounds.
limit_req_zone $binary_remote_addr zone=edge:20m rate=10000r/s;

# Auth rate limit: login/refresh/register — must allow the dashboard's
# session-restore + proactive-refresh traffic (2r/s burst 5 was 429-storming
# the live site and blocking login). 20r/s burst 40 is still abusive-traffic
# protective but permits normal + retry behaviour.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

# WebSocket connect rate limit
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

# General rate limit
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
