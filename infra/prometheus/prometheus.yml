global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'realtime-engine'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:13081']
        labels:
          service: 'go-realtime'

  - job_name: 'control-plane'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:13080']
        labels:
          service: 'nestjs-control'
