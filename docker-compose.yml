# ═══════════════════════════════════════════════════════════════
# Predict-A-Trade v1.0.0 — Full Docker Compose
# Every service in its own container — no host systemd services
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow all logs
#   docker compose logs -f realtime  # Follow one service
#   docker compose restart realtime  # Restart one service
#   docker compose down           # Stop all
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Database Layer ───
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: pat-postgres
    # Fix for "No space left on device" / shared-memory exhaustion: Docker's
    # default /dev/shm is 64MB, which PostgreSQL exceeds on large sorts/hashes
    # (e.g. multi-year backtest queries). Bump it well above working set.
    shm_size: '2gb'
    environment:
      POSTGRES_USER: pat_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: predictatrade
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # DB-5: initdb.d auto-run removed. scripts/migrate.sh is now the single
      # source of truth for schema. On a FRESH volume, run
      # `./scripts/migrate.sh up` (host, against 127.0.0.1:5432) or mount it
      # inside the postgres container and run it there BEFORE app services start.
      - pat-pgdata:/var/lib/postgresql/data
      - ./database/roles:/roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pat_admin -d predictatrade"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - pat-net
    restart: always

  valkey:
    image: valkey/valkey:8.0
    container_name: pat-valkey
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - pat-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pat-net
    restart: always

  # ─── Application Layer ───
  live-terminal:
    build:
      context: .
      dockerfile: live-terminal/Dockerfile
    container_name: pat-live-terminal
    env_file:
      - ./infra/env/realtime.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - UPSTREAM_REALTIME_URL=http://realtime:13081
      - JWT_SECRET=${JWT_SECRET}
      - LIVE_TERMINAL_PORT=13090
    ports:
      - "13090:13090"
    depends_on:
      realtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - pat-net
    restart: always

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    container_name: pat-realtime
    env_file:
      - ./infra/env/realtime.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - VALKEY_ADDR=valkey:6379
      - HTTP_HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - HTTP_PORT=13081
      - WS_PORT=13081
      # NOTE (v1.15.0 / MACRO_AUDIT 2.5): PAT_PAPER_EQUITY and the raised demo
      # position caps were REMOVED. In production, executable arming must gate on
      # VERIFIED broker equity/positions (Client Agent feed), NOT a seeded paper
      # constant. Until that feed exists the risk gates fail closed (veto), which
      # is the correct NO-GO-safe behavior. Set broker-backed caps here only after
      # the Client Agent forwards account_info + positions.
      - MAX_PER_STRATEGY_POSITIONS=1
      - MAX_TOTAL_POSITIONS=2
      - MAX_SAME_DIRECTION_POSITIONS=1
      # Optional: uncomment to decouple inbound agent data from the signal engine
      # via NATS (the `nats` service above must be running).
      # - NATS_URL=nats://nats:4222
    extra_hosts:
      # Host Ollama AI proxy (sentiment) — iptables restricts 11434 to docker nets
      - "host.docker.internal:host-gateway"
    ports:
      - "13081:13081"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - pat-net
    restart: always
    volumes:
      # Mount the calibration models so research-trained JSONs are live-updatable
      # without rebuilding, and so the Live Calibrator's retrains persist.
      - ./realtime/calibration:/app/calibration
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:13081/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  control:
    build:
      context: ./control
      dockerfile: Dockerfile
    container_name: pat-control
    env_file:
      - ./infra/env/control.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CONTROL_HOST=0.0.0.0
      - CONTROL_PORT=13080
    # Backtest engine binary — mounted read-only so the control plane can execute
    # real backtests inside the container (the engine is a Go binary built from
    # realtime/cmd/backtest-engine; it connects via DATABASE_URL above).
    volumes:
      - /srv/predictatrade/xauusd/realtime/bin/backtest-engine:/app/backtest-engine:ro
    # HA (2026-09-04): MT-client edge-poll must NEVER 502 during a deploy.
    # Control is stateless (PG-backed; edge-poll queue and the async backtest
    # job worker both claim work with FOR UPDATE SKIP LOCKED, so two instances
    # never double-run a job). nginx load-balances control + control-b and
    # retries the peer on failure — a single-container restart is invisible
    # to MT clients. Reach control via the docker network (nginx) or
    # `docker exec` — the host port binding is intentionally REMOVED.
    expose:
      - "13080"
    networks:
      pat-net:
        aliases:
          - control
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Second control-plane instance (identical build/env) — HA peer for
  # nginx upstream pool. No host port (nginx is the only entrypoint).
  control-b:
    build:
      context: ./control
      dockerfile: Dockerfile
    container_name: pat-control-b
    env_file:
      - ./infra/env/control.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CONTROL_HOST=0.0.0.0
      - CONTROL_PORT=13080
    volumes:
      - /srv/predictatrade/xauusd/realtime/bin/backtest-engine:/app/backtest-engine:ro
    expose:
      - "13080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      pat-net:
        aliases:
          - control-b
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backtest:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    container_name: pat-backtest
    environment:
      - BACKTEST_DB_URL=${BACKTEST_DB_URL}
      - PAT_RESEARCH_SRC=/app/research/src
    ports:
      # MACRO_AUDIT 2.3: bind to localhost only; the public qr.predictatrade.com
      # proxy (nginx/sites-available/qr-temp.conf) was removed. The control-plane
      # backtest API already enforces JWT + user_id scoping.
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time (must match the public API origin).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.predictatrade.com/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.predictatrade.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://platform.predictatrade.com/ws/v1/relay}
    container_name: pat-frontend
    env_file:
      - ./infra/env/frontend.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=13082
    ports:
      - "13082:13082"
    depends_on:
      - control
      - realtime
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13082/"]
      interval: 10s
      timeout: 5s
      retries: 10

  status:
    build:
      context: ./status
      dockerfile: Dockerfile
    container_name: pat-status
    env_file:
      - ./infra/env/status.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=13083
    ports:
      - "13083:13083"
    depends_on:
      - control
      - realtime
    networks:
      - pat-net
    restart: always

  # ─── Reverse Proxy Layer ───
  nginx:
    image: nginx:alpine
    # nginx proxy needs reload
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./docs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - live-dashboard:/var/www/pat-live:ro
      - ./mql:/var/www/mql:ro
      - ./nginx/downloads:/var/www/downloads:ro
      - ssl-certs:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
      - /var/www/certbot:/var/www/certbot:ro
      # Documentation (self-hosted Docsify)
      - ./docs/nginx/docs.predictatrade.com.conf:/etc/nginx/conf.d/docs.predictatrade.com.conf:ro
      - ./docs:/var/www/pat-docs:ro
    depends_on:
      - realtime
      - live-terminal
      - frontend
      - control
      - status
    networks:
      - pat-net
    restart: always

  # ─── Mail plane: send-only submission relay (pat.predictatrade.com) ───
  # Go SMTP server. Control plane (nodemailer) submits here on :587 with AUTH;
  # relay delivers to internet MX (direct) or SMARTHOST with retry/backoff.
  # DNS (operator): A pat.predictatrade.com + SPF/DKIM(pat1)/DMARC on
  # predictatrade.com — see mail-relay/DEPLOY.md. NEVER an open relay: AUTH
  # required, From-domain enforced to ALLOWED_FROM_DOMAINS.
  mail-relay:
    build: ./mail-relay
    image: pat-mail-relay
    container_name: pat-mail-relay
    environment:
      SMTP_LISTEN: ":587"
      SMTP_TLS_LISTEN: ":465"
      # SEC-1: no committed default password. PAT_MAIL_USERS must be supplied via
      # infra/env/*.env (gitignored) in the form "user:password".
      SMTP_USERS: "${PAT_MAIL_USERS:-}"
      ALLOWED_FROM_DOMAINS: "predictatrade.com"
      MAIL_DOMAIN: "pat.predictatrade.com"
      DKIM_SELECTOR: "pat1"
      DKIM_DNS_DOMAIN: "predictatrade.com"
      DKIM_PRIVATE_KEY_PATH: "/etc/pat-mail/dkim.key"
      SQLITE_PATH: "/var/lib/pat-mail/spool.db"
      SMARTHOST: "${PAT_MAIL_SMARTHOST:-}"
    volumes:
      - ./mail-relay/certs:/etc/pat-mail:ro
      - pat-mail-spool:/var/lib/pat-mail
    ports:
      - "587:587"
      - "465:465"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 587"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pat-net
    restart: always

  # ─── Monitoring Layer ───
  prometheus:
    image: prom/prometheus:latest
    container_name: pat-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - pat-prometheus:/prometheus
    networks:
      - pat-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: pat-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pat-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pat-net
    restart: always

  # ─── Notifications ───
  ntfy:
    image: binwiederhier/ntfy
    container_name: pat-ntfy
    command: serve
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - pat-ntfy:/var/lib/ntfy
      - ./infra/ntfy/server.yml:/etc/ntfy/server.yml:ro
    networks:
      - pat-net
    restart: always

  # NATS — optional ingest/signal decoupling backbone. The realtime engine
  # defaults to an in-process DirectBus (no NATS). To fully decouple
  # data-collection from the signal engine (enables a separate ingest service),
  # set NATS_URL=nats://nats:4222 on the `realtime` service (and it will
  # activate automatically; the engine falls back to in-process on connect
  # failure, so this service is safe to leave running regardless).
  nats:
    image: nats:2.10-alpine
    container_name: pat-nats
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - pat-net
    restart: always

  # ─── Off-host backup sync (S3) ───
  # Continuously mirrors two sources to the external S3 bucket:
  #   1. /pgdata/wal_archive  -> s3://$S3_BUCKET/$S3_PREFIX       (PITR WAL segments)
  #   2. /pgbackups           -> s3://$S3_BUCKET/$DB_S3_PREFIX    (logical pg_dump archives
  #      written by scripts/backup/backup.sh — these dumps contain market.ticks, i.e.
  #      the realtime tick history; there are no separate tick files to sync)
  # Decoupled from PostgreSQL: Postgres only writes locally (fast, fail-closed);
  # this sidecar ships everything off-host. Credentials come from infra/env/.env
  # (BACKUP_S3_*). No secrets are committed.
  backup-sync:
    image: amazon/aws-cli:latest
    container_name: pat-backup-sync
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      AWS_REGION: ${BACKUP_S3_REGION}
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-predictatrade/wal}
      DB_S3_PREFIX: ${BACKUP_S3_DB_PREFIX:-predictatrade/db}
    volumes:
      - pat-pgdata:/pgdata:ro
      # Host-side logical dumps produced by scripts/backup/backup.sh (every 6h cron)
      - /var/backups/predictatrade:/pgbackups:ro
    restart: always
    networks:
      - pat-net
    # aws-cli image sets ENTRYPOINT=aws; override so the shell loop below runs
    # under /bin/sh instead of being passed to `aws` as a subcommand.
    entrypoint: ["/bin/sh", "-c"]
    # The loop must arrive at `sh -c` as ONE argument. List form guarantees it
    # (a folded scalar block is word-split by compose into separate Cmd entries,
    # so only "while true" reached sh and the container syntax-error looped).
    command:
      - |
        # Hetzner S3 rejects bursty multipart/concurrent requests from aws-cli
        # (botocore NoneType errors) — serialize uploads and retry harder.
        mkdir -p /tmp/aws && printf '[default]\ns3 =\n  max_concurrent_requests = 1\n  max_queue_size = 1\n  multipart_threshold = 64MB\nmax_attempts = 10\nretry_mode = adaptive\n' > /tmp/aws/config;
        export AWS_CONFIG_FILE=/tmp/aws/config;
        while true; do
          echo "[backup-sync] $$(date -u) syncing /pgdata/wal_archive -> s3://$${S3_BUCKET}/$${S3_PREFIX}";
          aws s3 sync /pgdata/wal_archive s3://$${S3_BUCKET}/$${S3_PREFIX} --endpoint-url $${S3_ENDPOINT} --no-progress 2>&1 || echo '[backup-sync] WAL sync failed, retrying';
          echo "[backup-sync] $$(date -u) syncing /pgbackups -> s3://$${S3_BUCKET}/$${DB_S3_PREFIX}";
          # Only timestamped dump artifacts (backup_2*.dump + sha256 sidecars) —
          # never logs, lock files, or old test dumps. A dump caught mid-write
          # re-uploads once complete (size/mtime change); restores must verify
          # the .sha256 sidecar before trusting any object.
          aws s3 sync /pgbackups s3://$${S3_BUCKET}/$${DB_S3_PREFIX} --exclude '*' --include 'backup_2*.dump' --include 'backup_2*.sha256' --include 'base/*' --include 'base/*.sha256' --endpoint-url $${S3_ENDPOINT} --no-progress 2>&1 || echo '[backup-sync] DB dump sync failed, retrying';
          sleep 60;
        done

volumes:
  pat-mail-spool:
  # Docker-managed named volumes — created automatically on first `docker compose up`.
  # Do NOT set external:true here; the "volume already exists" warning is cosmetic
  # and harmless (it means the volume survived a previous down/rm). external:true
  # would silently skip creation on a fresh machine, causing DATA LOSS when
  # pat-pgdata is missing and PostgreSQL cannot start.
  pat-pgdata:
  pat-valkey:
  pat-prometheus:
  pat-grafana:
  pat-ntfy:
  live-dashboard:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/pat-live
  ssl-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/nginx

networks:
  pat-net:
    driver: bridge
