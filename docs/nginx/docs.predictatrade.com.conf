# ─── docs.predictatrade.com ───
# Predict-A-Trade Documentation — Self-Hosted Docsify
# Mounted into pat-nginx container via docker-compose volume

server {
    listen 80;
    listen [::]:80;
    server_name docs.predictatrade.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve docs — static markdown + Docsify SPA
    root /var/www/pat-docs;
    index index.html;

    # SPA routing — fallback to index.html for markdown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Markdown served as text
    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown;
    gzip_min_length 256;
    gzip_vary on;
}

