# ═══════════════════════════════════════════════════════════════
# Predict-A-Trade v1.0.0 — Full Docker Compose
# Every service in its own container — no host systemd services
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow all logs
#   docker compose logs -f realtime  # Follow one service
#   docker compose restart realtime  # Restart one service
#   docker compose down           # Stop all
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Database Layer ───
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: pat-postgres
    # Fix for "No space left on device" / shared-memory exhaustion: Docker's
    # default /dev/shm is 64MB, which PostgreSQL exceeds on large sorts/hashes
    # (e.g. multi-year backtest queries). Bump it well above working set.
    shm_size: '2gb'
    environment:
      POSTGRES_USER: pat_admin
      POSTGRES_PASSWORD: pat_local_dev_only
      POSTGRES_DB: predictatrade
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pat-pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - ./database/roles:/roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pat_admin -d predictatrade"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - pat-net
    restart: always

  valkey:
    image: valkey/valkey:8.0
    container_name: pat-valkey
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - pat-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pat-net
    restart: always

  # ─── Application Layer ───
  live-terminal:
    build:
      context: .
      dockerfile: live-terminal.Dockerfile
    container_name: pat-live-terminal
    env_file:
      - ./infra/env/realtime.env
    environment:
      - DATABASE_URL=postgresql://pat_admin:pat_local_dev_only@postgres:5432/predictatrade?sslmode=disable
      - UPSTREAM_REALTIME_URL=http://realtime:13081
      - JWT_SECRET=lyFoqwbIPuflF/6PjNtrZXCM1wXGVfYJhj7ZxDAWKYA=
      - LIVE_TERMINAL_PORT=13090
    ports:
      - "13090:13090"
    depends_on:
      realtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - pat-net
    restart: always

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    container_name: pat-realtime
    env_file:
      - ./infra/env/realtime.env
    environment:
      - DATABASE_URL=postgresql://pat_admin:pat_local_dev_only@postgres:5432/predictatrade?sslmode=disable
      - VALKEY_ADDR=valkey:6379
      - HTTP_HOST=0.0.0.0
      - JWT_SECRET=lyFoqwbIPuflF/6PjNtrZXCM1wXGVfYJhj7ZxDAWKYA=
      - HTTP_PORT=13081
      - WS_PORT=13081
    extra_hosts:
      # Host Ollama AI proxy (sentiment) — iptables restricts 11434 to docker nets
      - "host.docker.internal:host-gateway"
    ports:
      - "13081:13081"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:13081/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  control:
    build:
      context: ./control
      dockerfile: Dockerfile
    container_name: pat-control
    env_file:
      - ./infra/env/control.env
    environment:
      - DATABASE_URL=postgresql://pat_admin:pat_local_dev_only@postgres:5432/predictatrade?sslmode=disable
      - CONTROL_HOST=0.0.0.0
      - CONTROL_PORT=13080
    # Backtest engine binary — mounted read-only so the control plane can execute
    # real backtests inside the container (the engine is a Go binary built from
    # realtime/cmd/backtest-engine; it connects via DATABASE_URL above).
    volumes:
      - /srv/predictatrade/xauusd/realtime/bin/backtest-engine:/app/backtest-engine:ro
    ports:
      - "13080:13080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backtest:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    container_name: pat-backtest
    environment:
      - BACKTEST_DB_URL=postgresql://pat_admin:pat_local_dev_only@postgres:5432/predictatrade?sslmode=disable
      - PAT_RESEARCH_SRC=/app/research/src
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time (must match the public API origin).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.predictatrade.com/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.predictatrade.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://platform.predictatrade.com/ws/v1/relay}
    container_name: pat-frontend
    env_file:
      - ./infra/env/frontend.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=13082
    ports:
      - "13082:13082"
    depends_on:
      - control
      - realtime
    networks:
      - pat-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13082/"]
      interval: 10s
      timeout: 5s
      retries: 10

  status:
    build:
      context: ./status
      dockerfile: Dockerfile
    container_name: pat-status
    env_file:
      - ./infra/env/status.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=13083
    ports:
      - "13083:13083"
    depends_on:
      - control
      - realtime
    networks:
      - pat-net
    restart: always

  # ─── Reverse Proxy Layer ───
  nginx:
    image: nginx:alpine
    container_name: pat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - live-dashboard:/var/www/pat-live:ro
      - ./windows-agent/deploy:/var/www/pat-deploy:ro
      - ./nginx/downloads:/var/www/downloads:ro
      - ssl-certs:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
      - /var/www/certbot:/var/www/certbot:ro
      # Documentation (self-hosted Docsify)
      - ./docs/nginx/docs.predictatrade.com.conf:/etc/nginx/conf.d/docs.predictatrade.com.conf:ro
      - ./docs:/var/www/pat-docs:ro
    depends_on:
      - realtime
      - live-terminal
      - frontend
      - control
      - status
    networks:
      - pat-net
    restart: always

  # ─── Monitoring Layer ───
  prometheus:
    image: prom/prometheus:latest
    container_name: pat-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - pat-prometheus:/prometheus
    networks:
      - pat-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: pat-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pat_local_dev_only
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pat-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pat-net
    restart: always

  # ─── Notifications ───
  ntfy:
    image: binwiederhier/ntfy
    container_name: pat-ntfy
    command: serve
    ports:
      - "8091:80"
    volumes:
      - pat-ntfy:/var/lib/ntfy
      - ./infra/ntfy/server.yml:/etc/ntfy/server.yml:ro
    networks:
      - pat-net
    restart: always

volumes:
  pat-pgdata:
  pat-valkey:
  pat-prometheus:
  pat-grafana:
  pat-ntfy:
  live-dashboard:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/pat-live
  ssl-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/nginx

networks:
  pat-net:
    driver: bridge
