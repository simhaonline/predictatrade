# ============================================================
# Predict-A-Trade — Edge CORS (single source of truth)
# ============================================================
# nginx OWNS all Access-Control-* headers for API responses.
# Upstream CORS headers are stripped (proxy_hide_header) and a
# single consistent set is emitted here with `always` so that
# redirects, 4xx/5xx and preflights ALL carry correct CORS.
#
# This fixes two browser failures:
#  1. duplicate ACAO when backend also emits CORS -> rejected
#  2. redirects/errors without CORS -> "blocked by CORS policy"
#
# Allowed origins come from the $cors_allow_origin map in
# nginx.conf (http context). Unknown origins get NO header.
# ============================================================

# Strip whatever the upstream (NestJS / Go) emitted
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Vary;

# Emit exactly one consistent set
add_header Access-Control-Allow-Origin $cors_allow_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-Id, X-Device-Id" always;
add_header Access-Control-Expose-Headers "X-Correlation-Id" always;
add_header Access-Control-Max-Age 86400 always;
add_header Vary "Origin" always;
