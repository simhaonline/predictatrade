# ---- HTTPS: status + workflow (cluster-phase placeholders) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.simhaonline.ai workflow.simhaonline.ai;

    ssl_certificate     /etc/letsencrypt/live/api.simhaonline.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.simhaonline.ai/privkey.pem;

    location / {
        default_type application/json;
        return 503 '{"code":"not_deployed","message":"service lands with the cluster phase"}';
    }
}