# ============================================================
# downloads.predictatrade.com — Windows Agent Download Server
# Serves: agent.exe, nssm.exe (win32/win64), install/uninstall scripts
# SSL: Let's Encrypt (auto-renewed by certbot)
# ============================================================

# HTTP — redirect to HTTPS (except ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name downloads.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — serves the deploy directory at /windows-agent/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloads.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/downloads.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Main download location — serves files from deploy/ directory
    location /windows-agent/ {
        alias /var/www/pat-deploy/;

        autoindex off;

        # MIME types for download files. Scripts/config are MUTABLE (rebuilt on
        # every release) and must NEVER be cached — a cached install.ps1 is exactly
        # how clients fetched a stale copy and broke (missing functions). Cache-Control
        # no-store is set on EVERY download type so no proxy/CDN can cache a stale
        # file. Note: nginx regex locations match by ORDER (not specificity), so the
        # no-store header must live in each per-type block, not a later combined one.
        location ~ \.ps1$ {
            default_type text/plain;
            add_header Content-Disposition "inline" always;
            add_header Cache-Control "no-store" always;
        }
        location ~ \.bat$ {
            default_type text/plain;
            add_header Content-Disposition "inline" always;
            add_header Cache-Control "no-store" always;
        }
        location ~ \.json$ {
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        location ~ \.md$ {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }
        location ~ \.exe$ {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }

        # Ex EA source files (MQ4/MQ5 — attached to EA inputs/compile on device)
        location ~ \.mq[45]$ {
            default_type text/plain;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
        }
    }

    # Health check
    location = / {
        return 200 "downloads.predictatrade.com OK\n";
        add_header Content-Type text/plain;
    }
}
