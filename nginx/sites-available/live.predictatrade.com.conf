# ============================================================
# live.predictatrade.com — Realtime/Edge Domain
# Serves: Public live dashboard (view-only), WebSocket, HTTP API
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name live.predictatrade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.predictatrade.com;

    ssl_certificate /etc/letsencrypt/live/live.predictatrade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.predictatrade.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker embedded DNS — re-resolve upstream service names every 10s.
    # Without this, nginx caches container IPs at startup and returns 502
    # after any backend container is rebuilt/recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Public visitor traffic is served by the dedicated live-terminal edge
    # (static terminal + preview funnel + guarded proxy) — the trading
    # engine is never exposed to anonymous traffic.
    set $upstream_realtime http://live-terminal:13090;

    # Serve all static assets (index.html, sw.js, echarts.min.js, manifest.json, icons)
    # from the pat-live build directory. Without this, assets fall through to the
    # nginx default root (/etc/nginx/html) and 404.
    root /var/www/pat-live;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP — allow WS connections to self
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://live.predictatrade.com https://live.predictatrade.com; frame-ancestors 'none'" always;

    # Public live dashboard (view-only, no auth)
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback: serve existing static assets, otherwise fall back to index.html
    # for client-side routes. Specific prefixes (/api/v1/, /ws, /health) take
    # precedence over this generic rule.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Windows Agent WebSocket — NO connection limit (agents need reliable connection)
    # Must be exact match to avoid falling through to the /ws browser route with limit_conn
    location = /ws/v1/agent {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
    }

    location = /ws/agent {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
    }

    # WebSocket connections — browser/dashboard route (with connection limit)
    location /ws {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/websocket-proxy.conf;
        limit_conn conn_per_ip 10;
    }

    # Catch-all API proxy — routes ALL /api/v1/ requests to Go realtime engine
    # CORS: allow platform.predictatrade.com cross-origin access
    location /api/v1/ {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/cors-edge.conf;
        add_header Cache-Control "no-store" always;
    }

    # Health check (for monitoring)
    location = /health {
        proxy_pass $upstream_realtime;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    access_log /var/log/nginx/live.predictatrade.com.access.log;
    error_log /var/log/nginx/live.predictatrade.com.error.log warn;
}
